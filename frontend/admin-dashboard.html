<!DOCTYPE html>
<html>
<head>
  <title>Pharmacy Admin Dashboard</title>
  <link rel="stylesheet" href="admin-dashboard.css">
</head>

<body>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="profile-card">
      <img id="profilePic" src="./image/profile.png">
      <h3 id="profileName">Admin</h3>
      <p id="profileRole">Administrator</p>

      <button onclick="editProfile()">Edit Profile</button>

      <div id="editBox" style="display:none">
        <input id="newEmail" placeholder="New email">
        <button onclick="saveProfile()">Save</button>
      </div>
    </div>

    <ul class="menu">
      <li class="active">Dashboard</li>
      <li onclick="location.href='add-product.html'">Add Product</li>
      <li onclick="location.href='admin-products.html'">All Products</li>
      <li onclick="location.href='admin-orders.html'">Orders</li>
      <li onclick="location.href='admin-users.html'">Users</li>
      <li onclick="logout()">Logout</li>
    </ul>

  </div>

  <!-- Main -->
  <div class="main">

    <div class="topbar">
      <h1>Pharmacy Admin Panel</h1>
    </div>

    <!-- Stats -->
    <div class="stats">

      <div class="stat-card">
        <h3>Total Products</h3>
        <p id="statProducts">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Users</h3>
        <p id="statUsers">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Orders</h3>
        <p id="statSales">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Revenue</h3>
        <p id="statRevenue">₹0</p>
      </div>

    </div>

    <!-- Products List -->
    <div class="card">
      <div class="card-head">
        <h2>Latest Medicines</h2>
        <input id="searchBox" placeholder="Search product">
      </div>

      <div id="productList"></div>
    </div>

  </div>

</div>

<script src="admin.js"></script>

</body>
</html>
