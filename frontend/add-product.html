<!DOCTYPE html>
<html>
<head>
  <title>Add Medicine</title>
  <link rel="stylesheet" href="admin-dashboard.css">
</head>

<body>

<div class="layout">

  <!-- Sidebar SAME -->
  <div class="sidebar">

    <div class="profile-card">
      <img id="profilePic" src="./image/profile.png">
      <h3 id="profileName">Admin</h3>
      <p id="profileRole">Administrator</p>
    </div>

    <ul class="menu">
      <li onclick="location.href='admin-dashboard.html'">Dashboard</li>
      <li class="active">Add Product</li>
      <li onclick="location.href='admin-products.html'">All Products</li>
      <li onclick="location.href='admin-orders.html'">Orders</li>
      <li onclick="location.href='admin-users.html'">Users</li>
      <li onclick="logout()">Logout</li>
    </ul>

  </div>

  <!-- Main -->
  <div class="main">

    <div class="card add-card">

      <h2>Add Medicine Product</h2>

      <form id="productForm" class="product-form">

        <input id="title" placeholder="Medicine Name" required>

        <textarea id="description" placeholder="Description"></textarea>

        <input id="brand" placeholder="Brand / Company">

        <input type="file" id="image">

        <input id="price" type="number" placeholder="Price" required>

        <input id="stock" type="number" placeholder="Stock Qty">

        <input id="category" placeholder="Category (tablet, syrup, etc)">

        <input id="offer" placeholder="Offer % or text">

        <button type="submit">Add Product</button>

      </form>

    </div>

  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
